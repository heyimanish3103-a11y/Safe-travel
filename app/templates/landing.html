<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Journey</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        body, html {
            height: 100%; width: 100%;
            overflow: hidden;
            background-color: #000;
        }

        /* Background Slider */
        .bg-slider {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            background-size: cover;
            background-position: center;
            animation: slideBg 20s infinite;
        }
        
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.7) 100%);
            z-index: 2;
        }

        @keyframes slideBg {
            0% { background-image: url('https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80'); }
            33% { background-image: url('https://images.unsplash.com/photo-1506929562872-bb421503ef21?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80'); }
            66% { background-image: url('https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80'); }
            100% { background-image: url('https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80'); }
        }

        /* Minimal Content */
        .content {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            color: #fff;
            padding: 2rem;
        }

        h1 {
            font-size: 4.5rem;
            font-weight: 800;
            letter-spacing: -2px;
            margin-bottom: 1rem;
            text-transform: uppercase;
        }

        p {
            font-size: 1.25rem;
            font-weight: 300;
            max-width: 600px;
            margin-bottom: 3rem;
            opacity: 0.9;
        }

        .btn-start {
            padding: 1rem 3rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-start:hover {
            background: #fff;
            color: #000;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        /* Navbar */
        nav {
            position: absolute;
            top: 0; left: 0; width: 100%;
            padding: 2rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        
        nav .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: #fff;
            text-decoration: none;
            letter-spacing: 1px;
        }

        nav .login-btn {
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            border-bottom: 2px solid transparent;
            transition: 0.3s;
        }
        
        nav .login-btn:hover {
            border-bottom: 2px solid #fff;
        }
    </style>
</head>
<body>

    <div class="bg-slider"></div>
    <div class="overlay"></div>

    <nav>
        <a href="/" class="logo">JOURNEY.</a>
        <a href="/login" class="login-btn">Log In</a>
    </nav>

    <div class="content">
        <h1>Discover the World</h1>
        <p>Plan your perfect trip, track your journey in real-time, and stay secure wherever you go.</p>
        <a href="/login" class="btn-start">Start Your Journey</a>
    </div>

</body>
</html>
