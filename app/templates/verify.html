<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Tourist ID Blockchain Verifier — Smart Shield</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- HTML5 QR Code Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        .verify-layout {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }
        .cert-card {
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid rgba(16, 185, 129, 0.4);
            border-radius: var(--radius-md);
            padding: 2.5rem;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 40px -15px rgba(16, 185, 129, 0.2);
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .cert-watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-25deg);
            font-size: 5rem;
            font-weight: 900;
            color: rgba(16, 185, 129, 0.04);
            letter-spacing: 0.2em;
            pointer-events: none;
            white-space: nowrap;
        }
        .field-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-top: 1.5rem;
        }
        @media (max-width: 600px) {
            .field-grid { grid-template-columns: 1fr; }
        }
        .cert-field {
            background: rgba(0, 0, 0, 0.25);
            padding: 1rem 1.25rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
        }
        .cert-label {
            font-size: 0.72rem;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 700;
            letter-spacing: 0.05em;
            margin-bottom: 0.35rem;
        }
        .cert-val {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        .cert-val-mono {
            font-family: var(--font-mono);
            font-size: 0.95rem;
            color: #38bdf8;
            word-break: break-all;
        }
        #reader {
            width: 100%;
            max-width: 480px;
            margin: 1rem auto;
            border-radius: var(--radius-sm);
            overflow: hidden;
            border: 1px solid var(--border-color);
            background: #000;
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar">
        <a href="/" class="brand">
            <div class="brand-icon" style="background: linear-gradient(135deg, #06b6d4, #6366f1);">
                <i class="fa-solid fa-qrcode"></i>
            </div>
            <span>Digital ID Blockchain Verifier</span>
        </a>
        <div class="nav-links">
            <a href="/" class="nav-link"><i class="fa-solid fa-house"></i> Home</a>
            <a href="/tourist" class="nav-link"><i class="fa-solid fa-person-walking"></i> Tourist Portal</a>
            <a href="/authority" class="nav-link"><i class="fa-solid fa-tower-broadcast"></i> Authority Center</a>
            <a href="/admin" class="nav-link"><i class="fa-solid fa-draw-polygon"></i> Geo-Fence Studio</a>
            <a href="/verify" class="nav-link active"><i class="fa-solid fa-qrcode"></i> ID Verifier</a>
        </div>
    </nav>

    <div class="verify-layout">
        
        <div style="text-align: center; margin-bottom: 2rem;">
            <h1 style="font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem;">
                <i class="fa-solid fa-shield-halved" style="color: #34d399; margin-right: 0.5rem;"></i>
                Cryptographic ID Verification
            </h1>
            <p style="color: var(--text-secondary); font-size: 0.95rem;">
                Instant, tamper-evident verification against the simulated Polygon Blockchain Ledger.
            </p>
        </div>

        <!-- Search / Scan Box -->
        <div class="glass-panel" style="padding: 1.75rem; margin-bottom: 2rem;">
            <div style="display: flex; gap: 0.75rem; flex-wrap: wrap;">
                <input type="text" id="verifyInput" placeholder="Enter Tourist ID (e.g. TID-2026-001-PRIYA)" 
                       style="flex: 1; min-width: 250px; padding: 0.75rem 1rem; border-radius: var(--radius-sm); background: #0f172a; border: 1px solid var(--border-color); color: white; font-family: var(--font-mono); font-size: 0.95rem;">
                <button id="btnVerify" class="btn btn-primary" style="padding: 0.75rem 1.5rem;">
                    <i class="fa-solid fa-magnifying-glass"></i> Verify Record
                </button>
                <button id="btnToggleCamera" class="btn btn-secondary" style="padding: 0.75rem 1.25rem;">
                    <i class="fa-solid fa-camera"></i> Scan QR
                </button>
            </div>

            <!-- QR Reader Element -->
            <div id="scannerSection" style="display: none; margin-top: 1.5rem; text-align: center;">
                <div id="reader"></div>
                <button id="btnCloseScanner" class="btn btn-secondary btn-sm" style="margin-top: 0.5rem;">
                    <i class="fa-solid fa-xmark"></i> Close Camera
                </button>
            </div>

            <!-- Quick Demo Selectors -->
            <div style="margin-top: 1.25rem; display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; font-size: 0.8rem; color: var(--text-muted);">
                <span>Quick Test Credentials:</span>
                <button class="badge badge-low demo-btn" data-id="TID-2026-001-PRIYA" style="cursor: pointer; border: 1px solid var(--border-color);">Priya Sharma</button>
                <button class="badge badge-low demo-btn" data-id="TID-2026-002-ALEX" style="cursor: pointer; border: 1px solid var(--border-color);">Alex Johnson</button>
                <button class="badge badge-low demo-btn" data-id="TID-2026-003-CARLOS" style="cursor: pointer; border: 1px solid var(--border-color);">Carlos Gomez</button>
            </div>
        </div>

        <!-- Verification Result Container -->
        <div id="resultContainer" style="display: none;"></div>

    </div>

    <script>
        const input = document.getElementById('verifyInput');
        const btnVerify = document.getElementById('btnVerify');
        const resultContainer = document.getElementById('resultContainer');
        const btnToggleCamera = document.getElementById('btnToggleCamera');
        const scannerSection = document.getElementById('scannerSection');
        const btnCloseScanner = document.getElementById('btnCloseScanner');
        let html5QrCode = null;

        // Auto check query param or path
        const urlParams = new URLSearchParams(window.location.search);
        const queryId = urlParams.get('id');
        if (queryId) {
            input.value = queryId;
            verifyId(queryId);
        }

        document.querySelectorAll('.demo-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                input.value = btn.dataset.id;
                verifyId(btn.dataset.id);
            });
        });

        btnVerify.addEventListener('click', () => {
            const tid = input.value.trim();
            if (tid) verifyId(tid);
        });

        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const tid = input.value.trim();
                if (tid) verifyId(tid);
            }
        });

        async function verifyId(digitalId) {
            resultContainer.style.display = 'block';
            resultContainer.innerHTML = `
                <div class="glass-panel" style="padding: 2.5rem; text-align: center; color: var(--text-muted);">
                    <i class="fa-solid fa-spinner fa-spin fa-2x" style="color: var(--primary); margin-bottom: 1rem;"></i>
                    <div>Querying Blockchain Ledger Consensus Nodes...</div>
                </div>
            `;

            try {
                const res = await fetch(`/api/v1/tourists/verify/${encodeURIComponent(digitalId)}`);
                const data = await res.json();

                if (data.is_valid) {
                    resultContainer.innerHTML = `
                        <div class="cert-card">
                            <div class="cert-watermark">AUTHENTIC</div>
                            
                            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
                                <div>
                                    <div style="display: inline-flex; align-items: center; gap: 0.5rem; background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.4); color: #34d399; padding: 0.4rem 0.85rem; border-radius: 9999px; font-weight: 700; font-size: 0.85rem; margin-bottom: 0.5rem;">
                                        <i class="fa-solid fa-shield-check"></i> ${data.verification_status}
                                    </div>
                                    <h2 style="font-size: 1.75rem; font-weight: 800; color: #ffffff;">${data.name}</h2>
                                    <div style="color: var(--text-secondary); font-size: 0.88rem;">Official Certified Tourist Identity</div>
                                </div>
                                <div style="text-align: right;">
                                    <div class="badge badge-low" style="font-size: 0.75rem;"><i class="fa-solid fa-link"></i> POLYGON TESTNET</div>
                                    <div style="font-family: var(--font-mono); color: var(--text-muted); font-size: 0.8rem; margin-top: 0.3rem;">BLOCK #${data.blockchain_block}</div>
                                </div>
                            </div>

                            <div class="field-grid">
                                <div class="cert-field">
                                    <div class="cert-label">Digital Pass Identifier (TID)</div>
                                    <div class="cert-val-mono">${data.digital_id}</div>
                                </div>
                                <div class="cert-field">
                                    <div class="cert-label">Privacy-Masked Contact</div>
                                    <div class="cert-val">${data.contact_masked}</div>
                                </div>
                                <div class="cert-field">
                                    <div class="cert-label">Verification Timestamp</div>
                                    <div class="cert-val" style="font-size: 0.95rem;">${new Date().toLocaleString()}</div>
                                </div>
                                <div class="cert-field">
                                    <div class="cert-label">Consensus State</div>
                                    <div class="cert-val" style="color: #34d399;"><i class="fa-solid fa-circle-check"></i> Cryptographically Anchored</div>
                                </div>
                            </div>

                            <div style="margin-top: 1.5rem; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 1rem;">
                                <div class="cert-label">SHA-256 Merkle Ledger Transaction Hash</div>
                                <div class="cert-val-mono" style="font-size: 0.8rem;">${data.blockchain_hash}</div>
                            </div>

                            <div style="margin-top: 1.5rem; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); padding-top: 1.25rem;">
                                <span style="font-size: 0.8rem; color: var(--text-muted);">Smart Tourist Safety Monitoring System &bull; Version 1.0</span>
                                <button onclick="window.print()" class="btn btn-secondary btn-sm"><i class="fa-solid fa-print"></i> Print Proof</button>
                            </div>
                        </div>
                    `;
                } else {
                    resultContainer.innerHTML = `
                        <div class="glass-panel" style="padding: 2.5rem; text-align: center; border-color: rgba(239, 68, 68, 0.4); background: rgba(239, 68, 68, 0.05);">
                            <i class="fa-solid fa-triangle-exclamation fa-3x" style="color: #f87171; margin-bottom: 1rem;"></i>
                            <h3 style="font-size: 1.5rem; font-weight: 700; color: #f87171; margin-bottom: 0.5rem;">INVALID CREDENTIAL</h3>
                            <p style="color: var(--text-secondary); max-width: 500px; margin: 0 auto 1.5rem;">
                                The identifier <code style="color: #f87171; font-family: var(--font-mono);">${data.digital_id}</code> was not found on the active ledger. The pass may be fraudulent or unanchored.
                            </p>
                        </div>
                    `;
                }
            } catch (err) {
                resultContainer.innerHTML = `
                    <div class="glass-panel" style="padding: 2rem; text-align: center; color: #ef4444;">
                        Verification service unreachable. Check backend connection.
                    </div>
                `;
            }
        }

        // Camera QR Scanner logic
        btnToggleCamera.addEventListener('click', () => {
            scannerSection.style.display = 'block';
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                (decodedText) => {
                    // Extract ID
                    let parsedId = decodedText;
                    if (decodedText.includes("TOURIST_SAFETY_ID:")) {
                        const parts = decodedText.split("|");
                        const idPart = parts[0].replace("TOURIST_SAFETY_ID:", "").trim();
                        parsedId = idPart;
                    }
                    input.value = parsedId;
                    html5QrCode.stop().then(() => {
                        scannerSection.style.display = 'none';
                        verifyId(parsedId);
                    });
                },
                (errorMessage) => {
                    // scanning...
                }
            ).catch(err => {
                alert("Camera permission denied or camera not found: " + err);
                scannerSection.style.display = 'none';
            });
        });

        btnCloseScanner.addEventListener('click', () => {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    scannerSection.style.display = 'none';
                });
            } else {
                scannerSection.style.display = 'none';
            }
        });
    </script>
</body>
</html>
